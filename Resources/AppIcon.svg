<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tjuvkik app icon: the Bento board, glass on the wallpaper. scripts/make-icon.sh turns it into AppIcon.icns. -->
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="purple" gradientUnits="userSpaceOnUse" cx="220" cy="880" r="640"><stop offset="0" stop-color="#7b47b8"/><stop offset="1" stop-color="#7b47b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal" gradientUnits="userSpaceOnUse" cx="880" cy="140" r="560"><stop offset="0" stop-color="#2289a8"/><stop offset="1" stop-color="#2289a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink" gradientUnits="userSpaceOnUse" cx="780" cy="960" r="520"><stop offset="0" stop-color="#c84f7a"/><stop offset="1" stop-color="#c84f7a" stop-opacity="0"/></radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8be9fd" stop-opacity=".35"/><stop offset="1" stop-color="#8be9fd" stop-opacity="0"/></linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <rect width="1024" height="1024" fill="#1d1636"/>
    <rect width="1024" height="1024" fill="url(#purple)"/>
    <rect width="1024" height="1024" fill="url(#teal)"/>
    <rect width="1024" height="1024" fill="url(#pink)"/>

    <rect x="176" y="240" width="672" height="596" rx="64" fill="#000" opacity=".45" filter="url(#blur)"/>
    <rect x="176" y="214" width="672" height="596" rx="64" fill="#1e1f29" fill-opacity=".62" stroke="#fff" stroke-opacity=".16" stroke-width="3"/>

    <g fill="#000" fill-opacity=".3" stroke="#fff" stroke-opacity=".07" stroke-width="3">
      <rect x="200" y="238" width="302" height="548" rx="34"/>
      <rect x="522" y="238" width="302" height="169" rx="34"/>
      <rect x="522" y="427" width="302" height="359" rx="34"/>
    </g>

    <circle cx="248" cy="306" r="20" fill="#ffb86c"/>
    <circle cx="248" cy="424" r="20" fill="#bd93f9"/>
    <circle cx="248" cy="542" r="20" fill="#8be9fd"/>
    <circle cx="248" cy="660" r="20" fill="#50fa7b"/>
    <g fill="#f8f8f2" opacity=".85">
      <rect x="286" y="293" width="172" height="26" rx="13"/>
      <rect x="286" y="411" width="136" height="26" rx="13"/>
      <rect x="286" y="529" width="160" height="26" rx="13"/>
      <rect x="286" y="647" width="118" height="26" rx="13"/>
    </g>
    <g fill="#f8f8f2" opacity=".3">
      <rect x="286" y="332" width="103" height="16" rx="8"/>
      <rect x="286" y="450" width="82" height="16" rx="8"/>
      <rect x="286" y="568" width="96" height="16" rx="8"/>
      <rect x="286" y="686" width="71" height="16" rx="8"/>
    </g>

    <rect x="552" y="276" width="112" height="20" rx="10" fill="#f8f8f2" opacity=".45"/>
    <rect x="552" y="338" width="242" height="26" rx="13" fill="#fff" opacity=".1"/>
    <rect x="552" y="338" width="172" height="26" rx="13" fill="#50fa7b"/>

    <path d="M556 726 L600 680 L640 700 L690 610 L736 640 L790 548 V760 H556 Z" fill="url(#area)"/>
    <polyline points="556,726 600,680 640,700 690,610 736,640 790,548" fill="none" stroke="#8be9fd" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
</svg>
