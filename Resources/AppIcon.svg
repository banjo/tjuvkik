<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tjuvkik app icon: two eyes peeking over a panel. scripts/make-icon.sh turns it into AppIcon.icns. -->
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7383b8"/><stop offset="1" stop-color="#4f5d8c"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g fill="#fff"><ellipse cx="382" cy="500" rx="118" ry="132"/><ellipse cx="642" cy="500" rx="118" ry="132"/></g>
    <g fill="#1d1636"><circle cx="422" cy="464" r="60"/><circle cx="682" cy="464" r="60"/></g>
    <rect x="170" y="540" width="684" height="600" rx="72" fill="#1e1f29"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
</svg>