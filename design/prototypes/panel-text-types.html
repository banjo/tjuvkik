<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tjuvkik — text panel types</title>
<style>
:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  /* dark-glass, as in Theme.swift */
  --ink: 255, 255, 255;
  --panel: rgba(30, 31, 41, 0.55);
  --well: rgba(0, 0, 0, 0.28);
  --fg: #f8f8f2;
  --muted: rgba(248, 248, 242, 0.58);
  --faint: rgba(248, 248, 242, 0.36);
  --line: rgba(255, 255, 255, 0.08);
  --warning: #ffb86c;
  --error: #ff6e6e;
  --success: #50fa7b;
  --info: #8be9fd;
  --accent: #bd93f9;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Desktop (context, not judged) ---------- */
.desk {
  position: fixed; inset: 0;
  background:
    radial-gradient(1100px 800px at 12% 88%, #6b3fa0 0%, transparent 60%),
    radial-gradient(1000px 700px at 88% 8%, #1f6f8b 0%, transparent 55%),
    radial-gradient(900px 900px at 72% 96%, #b4466b 0%, transparent 55%),
    #1b1530;
}
.menubar {
  position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 5;
  display: flex; align-items: center; gap: 18px; padding: 0 16px;
  font-size: 13px; color: #fff;
  background: rgba(20, 16, 36, 0.35);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.menubar .spacer { flex: 1; }
.notch { position: fixed; top: 0; left: 50%; width: 196px; height: 32px; margin-left: -98px; z-index: 6; background: #000; border-radius: 0 0 12px 12px; }
.backdrop { position: fixed; inset: 0; background: rgba(10, 8, 20, 0.28); }

/* ---------- Board ---------- */
.board {
  position: fixed; top: 12vh; left: 50%; transform: translateX(-50%);
  width: min(1080px, calc(100vw - 48px)); height: min(580px, 68vh);
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px;
}
.tile {
  position: relative; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; padding: 12px;
  border-radius: 16px; overflow: hidden;
  background: var(--panel);
  -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  box-shadow: 0 0 0 1px var(--line) inset, 0 18px 40px rgba(0, 0, 0, 0.18);
  animation: tile-in 220ms var(--ease-out) both;
  animation-delay: calc(var(--i) * 30ms);
}
@keyframes tile-in { from { opacity: 0; transform: scale(0.97); } }
@media (prefers-reduced-motion: reduce) {
  .tile { animation-name: tile-fade; }
  @keyframes tile-fade { from { opacity: 0; } }
}
.tile-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex: none; }
.tile-h .title { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-h .kind {
  flex: none; font: 500 9.5px/1 var(--mono); color: var(--faint);
  padding: 2px 5px; border-radius: 4px; background: var(--well);
}
.tile-h .every { margin-left: auto; flex: none; font-size: 10.5px; color: var(--faint); }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Tones */
[data-tone=warning] { --tone: var(--warning); }
[data-tone=error] { --tone: var(--error); }
[data-tone=success] { --tone: var(--success); }
[data-tone=info] { --tone: var(--info); }
[data-tone=accent] { --tone: var(--accent); }
[data-tone=muted] { --tone: var(--faint); }
.t-tone { color: var(--tone, var(--fg)); }

.num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.label { font-size: 11.5px; color: var(--muted); }
.foot { margin-top: auto; padding-top: 8px; font-size: 11px; color: var(--faint); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
.foot b { font-weight: 500; color: var(--muted); }
.delta { font-size: 11.5px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--tone, var(--muted)); white-space: nowrap; }

/* ---------- 6. markdown ---------- */
.md { font-size: 12.5px; line-height: 1.5; color: var(--fg); overflow: hidden; flex: 1; min-height: 0; }
.md h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.md h4 { margin: 10px 0 3px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.md p { margin: 0 0 6px; color: var(--muted); }
.md p b, .md li b { color: var(--fg); font-weight: 600; }
.md ul, .md ol { margin: 0 0 6px; padding-left: 18px; color: var(--muted); }
.md li { margin: 1px 0; }
.md li::marker { color: var(--faint); }
.md code { white-space: nowrap; font: 11.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--well); color: var(--fg); }
.md pre { margin: 4px 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--well); font: 11.5px/1.5 var(--mono); color: var(--fg); white-space: pre; overflow: hidden; }
.md a { color: var(--info); text-decoration: none; }
.md blockquote { margin: 4px 0 8px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); box-shadow: 2px 0 0 var(--warning) inset; }
.md-cols { columns: 2; column-gap: 20px; }
.md-cols h4 { break-after: avoid; }
.md-cols > * { break-inside: avoid; }
.md-s h3 { font-size: 15px; }
.md-s p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- 7. key-value ---------- */
.kv { display: grid; grid-template-columns: auto 1fr; column-gap: 0; align-content: start; flex: 1; min-height: 0; }
.kv dt, .kv dd { margin: 0; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; min-width: 0; }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { padding-left: 14px; font-family: var(--mono); font-size: 11.5px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tone, var(--fg)); }
.kv dd .pill { display: inline-block; padding: 0 6px; border-radius: 99px; background: color-mix(in srgb, var(--tone) 16%, transparent); font-family: inherit; }
.kv-h { grid-column: 1 / -1; padding: 10px 0 2px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.kv-h:first-child { padding-top: 0; }
.kv-2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; flex: 1; }
.kv-s dd { text-align: left; padding-left: 0; }
.kv-s { grid-template-columns: 1fr; }
.kv-s dt { padding: 6px 0 0; border: 0; font-size: 10.5px; }
.kv-s dd { padding: 0 0 6px; border: 0; font-size: 13px; border-bottom: 1px solid var(--line); }
.kv-s dt:first-of-type { padding-top: 0; }

/* ---------- 8. table ---------- */
.tb { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; table-layout: fixed; }
.tb th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); padding: 0 6px 6px; white-space: nowrap; }
.tb td { padding: 5px 6px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tone, var(--fg)); }
.tb td.mono { font-family: var(--mono); font-size: 11px; }
.tb td.dim { color: var(--muted); }
.tb [data-align=right] { text-align: right; }
.tb th:first-child, .tb td:first-child { padding-left: 0; }
.tb th:last-child, .tb td:last-child { padding-right: 0; }
.tb .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--tone); margin-right: 6px; vertical-align: 1px; }
.tb tr[data-hl] td { background: color-mix(in srgb, var(--error) 8%, transparent); }
.tb-wrap { flex: 1; min-height: 0; overflow: hidden; }

/* ---------- 9. feed ---------- */
.fd { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.fd-day { padding: 4px 0 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.fd-i { display: grid; grid-template-columns: 26px 1fr auto; column-gap: 9px; row-gap: 1px; padding: 7px 0; border-top: 1px solid var(--line); }
.fd-day + .fd-i, .fd > .fd-i:first-child { border-top: 0; padding-top: 0; }
.fd-i > .av { grid-row: 1 / span 2; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; color: #1d1d1f; background: var(--c, #8be9fd); }
.av.sq { border-radius: 7px; font-size: 13px; background: var(--well); }
.fd-i .who { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-i .who span { font-weight: 400; color: var(--muted); }
.fd-i .msg { grid-column: 2 / -1; font-size: 12px; line-height: 1.4; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fd-i .msg b { color: var(--fg); font-weight: 500; }
.fd-i .when { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.fd-i[data-unread] .who::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--info); vertical-align: 1.5px; }
.fd-big { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.fd-big .q { font-size: 14px; line-height: 1.4; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.fd-big .by { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.fd-big .by .av { width: 20px; height: 20px; font-size: 9px; }
.fd-big .more { margin-left: auto; color: var(--info); }

/* ---------- 10. checklist ---------- */
.ck { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.ck-i { display: flex; align-items: flex-start; gap: 9px; padding: 4px 0; font-size: 12.5px; line-height: 1.35; }
.ck-i .box { flex: none; width: 15px; height: 15px; margin-top: 1px; border-radius: 4.5px; box-shadow: 0 0 0 1.5px rgba(var(--ink), 0.28) inset; display: grid; place-items: center; font-size: 10px; color: #1b1530; }
.ck-i[data-state=done] .box { background: var(--success); box-shadow: none; }
.ck-i[data-state=done] .box::before { content: "✓"; font-weight: 700; }
.ck-i[data-state=done] .t { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(var(--ink), 0.25); }
.ck-i[data-state=doing] .box { box-shadow: 0 0 0 1.5px var(--accent) inset; }
.ck-i[data-state=doing] .box::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.ck-i[data-state=blocked] .box { box-shadow: 0 0 0 1.5px var(--error) inset; }
.ck-i[data-state=blocked] .box::before { content: "!"; color: var(--error); font-weight: 700; }
.ck-i .t { flex: 1; min-width: 0; }
.ck-i .t small { display: block; font-size: 11px; color: var(--muted); }
.ck-i[data-state=blocked] .t small { color: var(--error); }
.ck-i .who { flex: none; font-size: 10.5px; color: var(--faint); }
.ck-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.ck-h b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ck-h span { font-size: 11.5px; color: var(--muted); }
.ck-bar { height: 4px; border-radius: 99px; background: var(--well); margin-bottom: 8px; overflow: hidden; display: flex; gap: 2px; }
.ck-bar i { height: 100%; background: var(--success); }
.ck-bar i + i { background: var(--accent); }
.ck-sec { padding: 8px 0 2px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.ck-folded { margin-top: auto; padding-top: 6px; font-size: 11px; color: var(--faint); }
.ck-s { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.ck-s .next { margin-top: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.ck-s .nt { margin-top: 2px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ck-cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; align-content: start; }

/* ---------- Spec drawer + hint (harness chrome, not judged) ---------- */
.spec {
  position: fixed; top: 44px; right: 12px; bottom: 76px; width: 400px; z-index: 2147483640;
  display: flex; flex-direction: column; gap: 10px; padding: 16px;
  border-radius: 14px; background: rgba(10, 10, 10, 0.86);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.3);
  font-size: 12px; line-height: 1.5; color: rgba(255, 255, 255, 0.7);
  transform: translateX(calc(100% + 24px)); transition: transform 240ms var(--ease-out);
}
.spec[data-open] { transform: none; }
.spec h2 { margin: 0; font-size: 14px; color: #fff; }
.spec p { margin: 0; }
.spec ul { margin: 0; padding-left: 16px; }
.spec pre {
  flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 12px; border-radius: 10px;
  background: rgba(255, 255, 255, 0.05); font: 11.5px/1.55 var(--mono); color: #e6e6e6; white-space: pre;
}
.spec pre .k { color: #8be9fd; }
.spec pre .s { color: #f1fa8c; }
.spec pre .c { color: #6272a4; }
.hint {
  position: fixed; left: 20px; bottom: 24px; z-index: 2147483646; max-width: 360px;
  padding: 10px 14px; border-radius: 14px; background: rgba(10, 10, 10, 0.78);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  font-size: 12px; line-height: 1.45; color: rgba(255, 255, 255, 0.62); user-select: none; -webkit-user-select: none;
}
.hint b { color: #fff; font-weight: 600; }
.hint kbd { font: 500 10.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); color: #fff; }
@media (prefers-reduced-motion: reduce) { .spec { transition: none; } }

/* ---------- Picker (verbatim spec) ---------- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}
.proto-picker-item:active {
  transform: scale(0.97);
}
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] {
  color: #fff;
}
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}
.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="desk"></div>
<div class="menubar"><span></span><b>Ghostty</b><span>File</span><span>Edit</span><span>View</span><span class="spacer"></span><span>❓ 1&nbsp;&nbsp;👀 2</span><span>Mon 16 Nov 13:40</span></div>
<div class="notch"></div>
<div class="backdrop"></div>
<main class="board" id="stage"></main>

<aside class="spec" id="spec"></aside>
<div class="hint" id="hint"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Markdown</button>
  <button class="proto-picker-item">Key-value</button>
  <button class="proto-picker-item">Table</button>
  <button class="proto-picker-item">Feed</button>
  <button class="proto-picker-item">Checklist</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
// The same six slots for every type: l, m, s, s, m, m on the 4×3 grid.
const SLOTS = [
  'grid-column: 1 / span 2; grid-row: 1 / span 2',
  'grid-column: 3 / span 2; grid-row: 1',
  'grid-column: 3; grid-row: 2',
  'grid-column: 4; grid-row: 2',
  'grid-column: 1 / span 2; grid-row: 3',
  'grid-column: 3 / span 2; grid-row: 3',
];

const tile = (i, t, body) => `
  <section class="tile" style="${SLOTS[i]}; --i:${i}">
    <header class="tile-h"><span class="title">${t.title}</span><span class="kind">${t.kind}</span><span class="every">${t.every === 'live' ? 'live' : `every ${t.every}`}</span></header>
    <div class="body">${body}</div>
  </section>`;

// ---------- 6. markdown ----------
const markdown = {
  l: d => `<div class="md">${d.html}</div>`,
  m: d => `<div class="md ${d.cols ? 'md-cols' : ''}">${d.html}</div>`,
  s: d => `<div class="md md-s">${d.html}</div>`,
};

// ---------- 7. key-value ----------
const kvPairs = items => items.map(i => i.section
  ? `<div class="kv-h">${i.section}</div>`
  : `<dt>${i.key}</dt><dd data-tone="${i.tone || ''}">${i.tone && i.pill ? `<span class="pill">${i.value}</span>` : i.value}</dd>`).join('');
const keyvalue = {
  l: d => `<dl class="kv">${kvPairs(d.items)}</dl>`,
  m: d => `<div class="kv-2"><dl class="kv">${kvPairs(d.items.slice(0, Math.ceil(d.items.length / 2)))}</dl><dl class="kv">${kvPairs(d.items.slice(Math.ceil(d.items.length / 2)))}</dl></div>`,
  s: d => `<dl class="kv kv-s">${kvPairs(d.items)}</dl>`,
};

// ---------- 8. table ----------
const table = {
  render: d => `<div class="tb-wrap"><table class="tb">
    <colgroup>${d.columns.map(c => `<col${c.width ? ` style="width:${c.width}"` : ''}>`).join('')}</colgroup>
    <thead><tr>${d.columns.map(c => `<th data-align="${c.align || 'left'}">${c.title}</th>`).join('')}</tr></thead>
    <tbody>${d.rows.map(r => `<tr ${r.hl ? 'data-hl' : ''}>${r.cells.map((cell, i) => {
      const c = typeof cell === 'object' ? cell : { text: cell };
      const col = d.columns[i];
      return `<td data-align="${col.align || 'left'}" class="${col.mono ? 'mono' : ''} ${c.dim ? 'dim' : ''}" ${c.tone ? `data-tone="${c.tone}"` : ''}>${c.dot ? '<i class="dot"></i>' : ''}${c.text}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`,
};
table.l = table.m = table.s = table.render;

// ---------- 9. feed ----------
const feedItem = i => `<div class="fd-i" ${i.unread ? 'data-unread' : ''}>
  ${i.icon ? `<span class="av sq">${i.icon}</span>` : `<span class="av" style="--c:${i.color}">${i.initials}</span>`}
  <span class="who">${i.who} <span>${i.where || ''}</span></span><span class="when">${i.when}</span>
  <span class="msg">${i.text}</span></div>`;
const feed = {
  l: d => `<div class="fd">${d.days.map(day => `<div class="fd-day">${day.title}</div>${day.items.map(feedItem).join('')}`).join('')}</div>`,
  m: d => `<div class="fd">${d.items.map(feedItem).join('')}</div>`,
  s: d => `<div class="fd-big"><div class="q">${d.text}</div>

// ---------- 10. checklist ----------
const ckItem = i => `<div class="ck-i" data-state="${i.state || 'todo'}"><span class="box"></span>
  <span class="t">${i.title}${i.note ? `<small>${i.note}</small>` : ''}</span>${i.who ? `<span class="who">${i.who}</span>` : ''}</div>`;
const progress = d => {
  const all = d.items.filter(i => !i.section);
  const done = all.filter(i => i.state === 'done').length;
  const doing = all.filter(i => i.state === 'doing').length;
  return { done, doing, total: all.length };
};
const checklist = {
  l: d => {
    const p = progress(d);
    const visible = d.items.filter(i => i.section || i.state !== 'done' || !d.foldDone);
    return `<div class="ck"><div class="ck-h"><b>${p.done}/${p.total}</b><span>${d.caption}</span></div>
      <div class="ck-bar"><i style="width:${p.done / p.total * 100}%"></i><i style="width:${p.doing / p.total * 100}%"></i></div>
      ${visible.map(i => i.section ? `<div class="ck-sec">${i.section}</div>` : ckItem(i)).join('')}
      ${d.foldDone ? `<div class="ck-folded">${p.done} done, hidden</div>` : ''}</div>`;
  },
  m: d => `<div class="ck ${d.cols ? 'ck-cols' : ''}">${d.items.map(ckItem).join('')}</div>`,
  s: d => {
    const p = progress(d);
    const next = d.items.find(i => i.state === 'doing') || d.items.find(i => !i.state || i.state === 'todo');
    return `<div class="ck-s"><div class="ck-h"><b>${p.done}/${p.total}</b><span>${d.caption}</span></div>
      <div class="ck-bar"><i style="width:${p.done / p.total * 100}%"></i><i style="width:${p.doing / p.total * 100}%"></i></div>
      <div class="next">Next</div><div class="nt">${next.title}</div></div>`;
  },
};

let specOpen = new URLSearchParams(location.search).get('json') === '1';
function renderSpec(i) {
  const t = TYPES[i];
  spec.innerHTML = `<h2>"type": "${t.kind}"</h2><p>${t.axis}</p><ul>${t.sizes.map(s => `<li>${s}</li>`).join('')}</ul><pre>${t.json}</pre>`;
  spec.toggleAttribute('data-open', specOpen);
  hint.innerHTML = `<b>${t.name}</b> · ${t.axis}<br><kbd>J</kbd> ${specOpen ? 'hide' : 'show'} the JSON a script prints`;
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.toLowerCase() !== 'j') return;
  specOpen = !specOpen;
  const url = new URL(location);
  url.searchParams.set('json', specOpen ? '1' : '0');
  history.replaceState(null, '', url);
  renderSpec(current);
});

// ---------- Picker wiring (verbatim) ----------
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
  renderSpec(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
