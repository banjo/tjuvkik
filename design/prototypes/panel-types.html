<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tjuvkik — panel types</title>
<style>
:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  /* dark-glass, as in Theme.swift */
  --ink: 255, 255, 255;
  --panel: rgba(30, 31, 41, 0.55);
  --well: rgba(0, 0, 0, 0.28);
  --fg: #f8f8f2;
  --muted: rgba(248, 248, 242, 0.58);
  --faint: rgba(248, 248, 242, 0.36);
  --line: rgba(255, 255, 255, 0.08);
  --warning: #ffb86c;
  --error: #ff6e6e;
  --success: #50fa7b;
  --info: #8be9fd;
  --accent: #bd93f9;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Desktop (context, not judged) ---------- */
.desk {
  position: fixed; inset: 0;
  background:
    radial-gradient(1100px 800px at 12% 88%, #6b3fa0 0%, transparent 60%),
    radial-gradient(1000px 700px at 88% 8%, #1f6f8b 0%, transparent 55%),
    radial-gradient(900px 900px at 72% 96%, #b4466b 0%, transparent 55%),
    #1b1530;
}
.menubar {
  position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 5;
  display: flex; align-items: center; gap: 18px; padding: 0 16px;
  font-size: 13px; color: #fff;
  background: rgba(20, 16, 36, 0.35);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.menubar .spacer { flex: 1; }
.notch { position: fixed; top: 0; left: 50%; width: 196px; height: 32px; margin-left: -98px; z-index: 6; background: #000; border-radius: 0 0 12px 12px; }
.backdrop { position: fixed; inset: 0; background: rgba(10, 8, 20, 0.28); }

/* ---------- Board ---------- */
.board {
  position: fixed; top: 12vh; left: 50%; transform: translateX(-50%);
  width: min(1080px, calc(100vw - 48px)); height: min(580px, 68vh);
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px;
}
.tile {
  position: relative; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; padding: 12px;
  border-radius: 16px; overflow: hidden;
  background: var(--panel);
  -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  box-shadow: 0 0 0 1px var(--line) inset, 0 18px 40px rgba(0, 0, 0, 0.18);
  animation: tile-in 220ms var(--ease-out) both;
  animation-delay: calc(var(--i) * 30ms);
}
@keyframes tile-in { from { opacity: 0; transform: scale(0.97); } }
@media (prefers-reduced-motion: reduce) {
  .tile { animation-name: tile-fade; }
  @keyframes tile-fade { from { opacity: 0; } }
}
.tile-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex: none; }
.tile-h .title { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-h .kind {
  flex: none; font: 500 9.5px/1 var(--mono); color: var(--faint);
  padding: 2px 5px; border-radius: 4px; background: var(--well);
}
.tile-h .every { margin-left: auto; flex: none; font-size: 10.5px; color: var(--faint); }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Tones */
[data-tone=warning] { --tone: var(--warning); }
[data-tone=error] { --tone: var(--error); }
[data-tone=success] { --tone: var(--success); }
[data-tone=info] { --tone: var(--info); }
[data-tone=accent] { --tone: var(--accent); }
[data-tone=muted] { --tone: var(--faint); }
.t-tone { color: var(--tone, var(--fg)); }

.num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.label { font-size: 11.5px; color: var(--muted); }
.foot { margin-top: auto; padding-top: 8px; font-size: 11px; color: var(--faint); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
.foot b { font-weight: 500; color: var(--muted); }
.delta { font-size: 11.5px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--tone, var(--muted)); white-space: nowrap; }

/* ---------- 1. chart ---------- */
.ch-top { display: flex; align-items: baseline; gap: 10px; }
.ch-val { font-size: 30px; font-weight: 600; line-height: 1; }
.ch-val small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.ch-plot { position: relative; flex: 1; min-height: 0; margin-top: 10px; }
.ch-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ch-y { position: absolute; right: 0; font-size: 9.5px; color: var(--warning); opacity: 0.8; transform: translateY(-135%); background: transparent; font-variant-numeric: tabular-nums; }
.ch-axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--faint); }
.ch-m { flex: 1; display: grid; grid-template-columns: 150px 1fr; gap: 14px; min-height: 0; }
.ch-m .ch-plot { margin-top: 2px; }
.ch-m .ch-left { display: flex; flex-direction: column; gap: 4px; justify-content: flex-end; padding-bottom: 2px; }
.ch-s .ch-val { font-size: 26px; }
.ch-s .ch-plot { margin: 8px -12px -12px; }

/* ---------- 2. meters ---------- */
.mt { display: flex; flex-direction: column; gap: 11px; flex: 1; justify-content: space-evenly; }
.mt-row { display: grid; grid-template-columns: 1fr auto; row-gap: 5px; column-gap: 8px; align-items: baseline; }
.mt-row .n { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-row .v { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mt-row .v b { color: var(--tone, var(--fg)); font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--well); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--tone, var(--accent)); }
.bar s { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: rgba(var(--ink), 0.45); text-decoration: none; }
.mt-m { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; flex: 1; align-content: center; }
.mt-m .mt-row { grid-template-columns: 1fr; }
.mt-m .big { font-size: 22px; font-weight: 600; line-height: 1; color: var(--tone, var(--fg)); }
.mt-m .big small { font-size: 12px; color: var(--muted); font-weight: 500; }
.ring { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
.ring svg { width: auto; height: 100%; max-height: 112px; aspect-ratio: 1; transform: rotate(-90deg); }
.ring .c { position: absolute; text-align: center; }
.ring .c b { display: block; font-size: 22px; font-weight: 600; line-height: 1; }
.ring .c span { font-size: 10.5px; color: var(--muted); }

/* ---------- 3. status grid ---------- */
.hm { flex: 1; display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; align-content: space-evenly; row-gap: 7px; column-gap: 10px; }
.hm .n { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm .p { font-size: 11px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.hm .p[data-tone] { color: var(--tone); }
.cells { display: grid; gap: 2px; grid-auto-flow: column; }
.cell { height: 18px; border-radius: 3px; background: var(--tone, rgba(var(--ink), 0.08)); opacity: var(--o, 1); }
.cell[data-tone=success] { --o: 0.55; }
.hm-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); grid-column: 2; margin-top: -2px; }
.legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--faint); align-items: center; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--tone); vertical-align: -0.5px; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px; background: var(--well); min-width: 0; }
.chip .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 18%, transparent); }
.chip .n { flex: 1; min-width: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .r { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chip[data-tone=error] .r, .chip[data-tone=warning] .r { color: var(--tone); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.dots i { width: 13px; height: 13px; border-radius: 3.5px; background: var(--tone); opacity: 0.85; }
.dots i[data-tone=success] { opacity: 0.45; }
.contrib { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; flex: 1; min-height: 0; }
.contrib i { border-radius: 2.5px; background: var(--accent); }

/* ---------- 4. timeline ---------- */
.ag { position: relative; flex: 1; min-height: 0; margin: 6px 0 2px 34px; }
.ag-h { position: absolute; left: -34px; right: 0; height: 0; border-top: 1px solid var(--line); }
.ag-h span { position: absolute; left: 0; top: -6px; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ev {
  position: absolute; left: 0; right: 0; padding: 3px 8px; border-radius: 6px; overflow: hidden;
  background: color-mix(in srgb, var(--tone, var(--accent)) 16%, transparent);
  box-shadow: 2px 0 0 var(--tone, var(--accent)) inset;
  font-size: 11.5px; line-height: 1.3;
}
.ev b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev span { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
.ev[data-short] { min-height: 20px; display: flex; align-items: center; padding-block: 0; }
.ev[data-past] { opacity: 0.45; }
.ev[data-now] { box-shadow: 2px 0 0 var(--tone, var(--accent)) inset, 0 0 0 1px color-mix(in srgb, var(--tone, var(--accent)) 45%, transparent) inset; }
.now { position: absolute; left: -6px; right: 0; height: 0; border-top: 1.5px solid var(--error); z-index: 2; }
.now::before { content: ""; position: absolute; left: -3px; top: -4.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--error); }
.strip { position: relative; height: 34px; margin-top: 4px; border-radius: 8px; background: var(--well); }
.strip .ev { top: 4px; bottom: 4px; left: auto; right: auto; padding: 0 6px; display: flex; align-items: center; font-size: 10.5px; border-radius: 5px; }
.strip .now { top: -4px; bottom: -4px; left: auto; right: auto; width: 0; border-top: 0; border-left: 1.5px solid var(--error); height: auto; }
.strip .now::before { left: -4.5px; top: -3px; }
.strip-axis { position: relative; height: 14px; margin-top: 5px; font-size: 10px; color: var(--faint); }
.strip-axis span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.strip-axis span { white-space: nowrap; }
.strip-axis span[style="left:0%"] { transform: none; }
.strip-axis span[style="left:100%"] { transform: translateX(-100%); }
.tl-m { display: flex; flex-direction: column; flex: 1; }
.tl-next { display: flex; gap: 18px; margin-top: auto; font-size: 12px; }
.tl-next div { min-width: 0; }
.tl-next .k { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
.tl-next b { font-weight: 500; }
.tl-next span { color: var(--muted); }
.cd { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.cd .when { font-size: 30px; font-weight: 600; line-height: 1; color: var(--tone, var(--fg)); }
.cd .what { margin-top: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd .where { margin-top: 2px; font-size: 11.5px; color: var(--muted); }
.cd .prog { margin-top: 10px; height: 4px; border-radius: 99px; background: var(--well); overflow: hidden; }
.cd .prog i { display: block; height: 100%; background: var(--tone, var(--accent)); border-radius: inherit; }

/* ---------- 5. stats ---------- */
.st { display: grid; gap: 8px; flex: 1; min-height: 0; }
.st-l { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); }
.st-m { grid-template-columns: repeat(3, 1fr); }
.st-c { display: flex; flex-direction: column; justify-content: space-between; padding: 9px 11px; border-radius: 10px; background: var(--well); min-width: 0; }
.st-c .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-c .v { font-size: 22px; font-weight: 600; line-height: 1.05; margin-top: 4px; }
.st-c .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.st-c .bottom { display: flex; gap: 6px; align-items: baseline; margin-top: 4px; min-width: 0; }
.st-c .vs { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-s { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.st-s .v { font-size: 34px; font-weight: 600; line-height: 1; }
.st-s .v small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.st-s .bottom { display: flex; gap: 6px; align-items: baseline; margin-top: 6px; }
.st-s .vs { font-size: 11px; color: var(--faint); }

/* ---------- Spec drawer + hint (harness chrome, not judged) ---------- */
.spec {
  position: fixed; top: 44px; right: 12px; bottom: 76px; width: 400px; z-index: 2147483640;
  display: flex; flex-direction: column; gap: 10px; padding: 16px;
  border-radius: 14px; background: rgba(10, 10, 10, 0.86);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.3);
  font-size: 12px; line-height: 1.5; color: rgba(255, 255, 255, 0.7);
  transform: translateX(calc(100% + 24px)); transition: transform 240ms var(--ease-out);
}
.spec[data-open] { transform: none; }
.spec h2 { margin: 0; font-size: 14px; color: #fff; }
.spec p { margin: 0; }
.spec ul { margin: 0; padding-left: 16px; }
.spec pre {
  flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 12px; border-radius: 10px;
  background: rgba(255, 255, 255, 0.05); font: 11.5px/1.55 var(--mono); color: #e6e6e6; white-space: pre;
}
.spec pre .k { color: #8be9fd; }
.spec pre .s { color: #f1fa8c; }
.spec pre .c { color: #6272a4; }
.hint {
  position: fixed; left: 20px; bottom: 24px; z-index: 2147483646; max-width: 360px;
  padding: 10px 14px; border-radius: 14px; background: rgba(10, 10, 10, 0.78);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  font-size: 12px; line-height: 1.45; color: rgba(255, 255, 255, 0.62); user-select: none; -webkit-user-select: none;
}
.hint b { color: #fff; font-weight: 600; }
.hint kbd { font: 500 10.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); color: #fff; }
@media (prefers-reduced-motion: reduce) { .spec { transition: none; } }

/* ---------- Picker (verbatim spec) ---------- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}
.proto-picker-item:active {
  transform: scale(0.97);
}
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] {
  color: #fff;
}
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}
.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="desk"></div>
<div class="menubar"><span></span><b>Ghostty</b><span>File</span><span>Edit</span><span>View</span><span class="spacer"></span><span>❓ 1&nbsp;&nbsp;👀 2</span><span>Mon 16 Nov 13:40</span></div>
<div class="notch"></div>
<div class="backdrop"></div>
<main class="board" id="stage"></main>

<aside class="spec" id="spec"></aside>
<div class="hint" id="hint"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Chart</button>
  <button class="proto-picker-item">Meters</button>
  <button class="proto-picker-item">Status grid</button>
  <button class="proto-picker-item">Timeline</button>
  <button class="proto-picker-item">Stats</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
// The same six slots for every type: l, m, s, s, m, m on the 4×3 grid.
const SLOTS = [
  'grid-column: 1 / span 2; grid-row: 1 / span 2',
  'grid-column: 3 / span 2; grid-row: 1',
  'grid-column: 3; grid-row: 2',
  'grid-column: 4; grid-row: 2',
  'grid-column: 1 / span 2; grid-row: 3',
  'grid-column: 3 / span 2; grid-row: 3',
];

const tile = (i, t, body) => `
  <section class="tile" style="${SLOTS[i]}; --i:${i}">
    <header class="tile-h"><span class="title">${t.title}</span><span class="kind">${t.kind}</span><span class="every">${t.every === 'live' ? 'live' : `every ${t.every}`}</span></header>
    <div class="body">${body}</div>
  </section>`;

// ---------- 1. chart ----------
function path(series, w, h, min, max) {
  const step = w / (series.length - 1);
  const y = v => h - ((v - min) / (max - min)) * h;
  return series.map((v, i) => `${i ? 'L' : 'M'}${(i * step).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
}
let gid = 0;
function plot(series, { tone = 'accent', min = Math.min(...series), max = Math.max(...series), threshold, grid = false, area = true } = {}) {
  const w = 300, h = 100, id = `g${gid++}`;
  const pad = (max - min) * 0.08 || 1;
  const lo = min - pad, hi = max + pad;
  const line = path(series, w, h, lo, hi);
  const y = v => h - ((v - lo) / (hi - lo)) * h;
  const last = series[series.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-tone="${tone}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--tone)" stop-opacity=".32"/><stop offset="1" stop-color="var(--tone)" stop-opacity="0"/></linearGradient></defs>
    ${grid ? [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="rgba(255,255,255,.06)" vector-effect="non-scaling-stroke"/>`).join('') : ''}
    ${threshold != null ? `<line x1="0" x2="${w}" y1="${y(threshold)}" y2="${y(threshold)}" stroke="var(--warning)" stroke-opacity=".7" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}
    ${area ? `<path d="${line} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>` : ''}
    <path d="${line}" fill="none" stroke="var(--tone)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${w}" cy="${y(last)}" r="2.5" fill="var(--tone)" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
const wave = (n, base, amp, seed, trend = 0) => Array.from({ length: n }, (_, i) =>
  Math.max(0, base + Math.sin(i * 0.45 + seed) * amp + Math.sin(i * 1.7 + seed * 2) * amp * 0.45 + (i / n) * trend));

    <div class="ch-plot">${plot(d.series, { tone: d.tone, grid: true, threshold: d.threshold, min: 0, max: 100 })}

    <div class="ch-axis"><span>−60m</span><span>−45m</span><span>−30m</span><span>−15m</span><span>now</span></div>

// ---------- 2. meters ----------
const bar = m => `<div class="mt-row" data-tone="${m.tone || 'accent'}">
  <span class="n">${m.label}</span><span class="v"><b>${m.text}</b>${m.of ? ` / ${m.of}` : ''}</span>
  <div class="bar"><i style="width:${m.pct}%"></i>${m.mark != null ? `<s style="left:${m.mark}%"></s>` : ''}</div></div>`;
const ring = (pct, tone, value, label) => {
  const r = 42, c = 2 * Math.PI * r;
  return `<div class="ring" data-tone="${tone}"><svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--well)" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--tone)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}"/></svg>
    <div class="c"><b class="num t-tone">${value}</b><span>${label}</span></div></div>`;
};
const meters = {
  l: d => `<div class="mt">${d.meters.map(bar).join('')}</div><div class="foot">${d.foot}</div>`,
  m: d => `<div class="mt-m">${d.meters.map(m => `<div class="mt-row" data-tone="${m.tone || 'accent'}">

const DAY = { from: 9, to: 17, now: 13 + 40 / 60 };
const pct = (h, from = DAY.from, to = DAY.to) => ((h - from) / (to - from)) * 100;
const timeline = {
  l: d => {
    const hours = Array.from({ length: DAY.to - DAY.from }, (_, i) => DAY.from + i);
    return `<div class="ag">
      ${hours.map(h => `<div class="ag-h" style="top:${pct(h)}%"><span>${String(h).padStart(2, '0')}</span></div>`).join('')}
      ${d.events.map(e => {
        const state = e.end <= DAY.now ? 'data-past' : e.start <= DAY.now ? 'data-now' : '';
        const short = e.end - e.start <= 0.5;
        return `<div class="ev" ${state} ${short ? 'data-short' : ''} data-tone="${e.tone || 'accent'}" style="top:calc(${pct(e.start)}% + 1px);height:calc(${pct(e.end) - pct(e.start)}% - 2px)${e.col ? `;left:${e.col}` : ''}">
          <b>${e.title}${short ? ` <span>${e.time}</span>` : ''}</b>${short ? '' : `<span>${e.time}${e.where ? ` · ${e.where}` : ''}</span>`}</div>`;
      }).join('')}
      <div class="now" style="top:${pct(DAY.now)}%"></div></div>`;
  },
  m: d => {
    const from = d.from, to = d.to;
    return `<div class="tl-m"><div class="strip">
      ${d.events.map(e => {
        const width = pct(e.end, from, to) - pct(e.start, from, to);

        return `<div class="ev" ${e.end <= d.now ? 'data-past' : e.start <= d.now ? 'data-now' : ''} data-tone="${e.tone || 'accent'}" style="left:${pct(e.start, from, to)}%;width:calc(${width}% - 2px)">${width >= e.title.length * 1.4 + 3 ? `<b>${e.title}</b>` : ''}</div>`;

      <div class="now" style="left:${pct(d.now, from, to)}%"></div></div>

        { title: 'Sprint 1', start: 0, end: 2, tone: 'muted' }, { title: 'Sprint 2', start: 2, end: 4, tone: 'muted' }, { title: 'Sprint 3', start: 4, end: 6, tone: 'muted' },
        { title: 'Sprint 4', start: 6, end: 8, tone: 'accent' }, { title: 'Hardening', start: 8, end: 9.3, tone: 'warning' }, { title: '🚀', start: 9.3, end: 10, tone: 'success' },
      ], ticks: [[0, 'Oct 5'], [4, 'Nov 2'], [8, 'Nov 30'], [10, 'Dec 14']],
        notes: [{ k: 'Now', title: 'Sprint 4', sub: 'day 3 of 10' }, { k: 'Release', title: 'Dec 14', sub: 'in 28 days' }] } },
    ],
  },
  {
    name: 'Stats', kind: 'stats', axis: 'Side by side: a few numbers, each against its last period.',
    sizes: ['<b>s</b> one number, its change, what it’s against', '<b>m</b> three numbers in a row', '<b>l</b> six numbers in a 2×3 grid'],
    json: `{
  <span class="k">"stats"</span>: [
    {
      <span class="k">"label"</span>: <span class="s">"Crash-free sessions"</span>,
      <span class="k">"value"</span>: <span class="s">"99.71"</span>, <span class="k">"unit"</span>: <span class="s">"%"</span>,
      <span class="k">"delta"</span>: <span class="s">"▼ 0.12"</span>,
      <span class="k">"tone"</span>: <span class="s">"error"</span>,          <span class="c">// the delta's: up isn't always good</span>
      <span class="k">"vs"</span>: <span class="s">"vs last week"</span>
    }
  ]
}
<span class="c">// s shows the first stat, m the first three, l six.</span>`,
    tiles: [
      { title: 'Sentry · logbook prod', kind: 'stats', every: '5m', s: 'l', d: { stats: [
        { label: 'Crash-free sessions', value: '99.71', unit: '%', delta: '▼ 0.12', tone: 'error', vs: 'vs last week' },
        { label: 'New issues', value: '14', delta: '▲ 5', tone: 'warning', vs: 'vs last week' },
        { label: 'Users affected', value: '312', delta: '▼ 41', tone: 'success', vs: 'vs last week' },
        { label: 'p95 page load', value: '1.8', unit: 's', delta: '▼ 0.3s', tone: 'success', vs: 'vs last week' },
        { label: 'Unresolved', value: '87', delta: '±0', tone: 'muted', vs: '3 assigned to you' },
        { label: 'Releases', value: '4', delta: '5.2.1', tone: 'info', vs: 'latest, 2h ago' },
      ] } },
      { title: 'GitHub this week', kind: 'stats', every: '1h', s: 'm', d: { stats: [
        { label: 'Merged', value: '12', delta: '▲ 4', tone: 'success', vs: 'vs last' },
        { label: 'Reviews given', value: '19', delta: '▲ 7', tone: 'success', vs: 'vs last' },
        { label: 'Time to review', value: '3.2', unit: 'h', delta: '▲ 1.1h', tone: 'warning', vs: 'median' },
      ] } },
      { title: 'Coverage', kind: 'stats', every: '1h', s: 's', d: { label: 'logbook, lines', value: '81.4', unit: '%', delta: '▲ 0.6', tone: 'success', vs: 'since 5.1' } },
      { title: 'Lead time', kind: 'stats', every: '1h', s: 's', d: { label: 'PR open to prod', value: '2.6', unit: 'd', delta: '▲ 0.8d', tone: 'warning', vs: 'vs sprint 1' } },
      { title: 'Jira · DSP Spark', kind: 'stats', every: '15m', s: 'm', d: { stats: [
        { label: 'In progress', value: '9', delta: '▲ 2', tone: 'warning', vs: 'WIP limit 8' },
        { label: 'Done this sprint', value: '21', unit: 'pts', delta: '62%', tone: 'accent', vs: 'of 34' },
        { label: 'Bugs open', value: '5', delta: '▼ 3', tone: 'success', vs: 'vs last sprint' },
      ] } },
      { title: 'Logbook usage', kind: 'stats', every: '1h', s: 'm', d: { stats: [
        { label: 'Active dealers', value: '1,284', delta: '▲ 3.1%', tone: 'success', vs: '7 days' },
        { label: 'Bookings', value: '18.2k', delta: '▲ 9%', tone: 'success', vs: '7 days' },
        { label: 'Exports', value: '642', delta: '▼ 12%', tone: 'muted', vs: '7 days' },
      ] } },
    ],
  },
];

const RENDER = { chart, meters, grid, timeline, stats };
const variants = TYPES.map(type => () => type.tiles.map((t, i) => {
  const r = RENDER[type.kind];
  return tile(i, t, t.contrib ? r.contrib(t.d) : r[t.s](t.d));
}).join(''));

// ---------- Spec drawer and hint ----------
const spec = document.getElementById('spec');
const hint = document.getElementById('hint');
let specOpen = new URLSearchParams(location.search).get('json') === '1';
function renderSpec(i) {
  const t = TYPES[i];
  spec.innerHTML = `<h2>"type": "${t.kind}"</h2><p>${t.axis}</p><ul>${t.sizes.map(s => `<li>${s}</li>`).join('')}</ul><pre>${t.json}</pre>`;
  spec.toggleAttribute('data-open', specOpen);
  hint.innerHTML = `<b>${t.name}</b> · ${t.axis}<br><kbd>J</kbd> ${specOpen ? 'hide' : 'show'} the JSON a script prints`;
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.toLowerCase() !== 'j') return;
  specOpen = !specOpen;
  const url = new URL(location);
  url.searchParams.set('json', specOpen ? '1' : '0');
  history.replaceState(null, '', url);
  renderSpec(current);
});

// ---------- Picker wiring (verbatim) ----------
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
  renderSpec(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
